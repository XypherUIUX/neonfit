          mkdir -p NeonFit/NeonFit.xcodeproj/xcshareddata/xcschemes
          cat > NeonFit/NeonFit.xcodeproj/xcshareddata/xcschemes/NeonFit.xcscheme <<'EOF_NEONFIT'
