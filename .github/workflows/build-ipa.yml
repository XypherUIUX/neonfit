                <BuildActionEntries>
                   <BuildActionEntry buildForTesting = "YES" buildForRunning = "YES" buildForProfiling = "YES" buildForArchiving = "YES" buildForAnalyzing = "YES">
                      <BuildableReference BuildableIdentifier = "primary" BlueprintIdentifier = "BBBBBBBBBBBBBBBB00000001" BuildableName = "NeonFit.app" BlueprintName = "NeonFit" ReferencedContainer = "container:NeonFit.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction buildConfiguration = "Debug" selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv = "YES" shouldAutocreateTestPlan = "YES">
             </TestAction>
             <LaunchAction buildConfiguration = "Debug" selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle = "0" useCustomWorkingDirectory = "NO" ignoresPersistentStateOnLaunch = "NO" debugDocumentVersioning = "YES" debugServiceExtension = "internal" allowLocationSimulation = "YES">
                <BuildableProductRunnable runnableDebuggingMode = "0">
                   <BuildableReference BuildableIdentifier = "primary" BlueprintIdentifier = "BBBBBBBBBBBBBBBB00000001" BuildableName = "NeonFit.app" BlueprintName = "NeonFit" ReferencedContainer = "container:NeonFit.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction buildConfiguration = "Release" shouldUseLaunchSchemeArgsEnv = "YES" savedToolIdentifier = "" useCustomWorkingDirectory = "NO" debugDocumentVersioning = "YES">
                <BuildableProductRunnable runnableDebuggingMode = "0">
                   <BuildableReference BuildableIdentifier = "primary" BlueprintIdentifier = "BBBBBBBBBBBBBBBB00000001" BuildableName = "NeonFit.app" BlueprintName = "NeonFit" ReferencedContainer = "container:NeonFit.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction buildConfiguration = "Debug">
             </AnalyzeAction>
             <ArchiveAction buildConfiguration = "Release" revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          EOF_NEONFIT
          find NeonFit -type f | sort

      - name: Compilar la app iOS (sin firmar)
        run: |
          xcodebuild -project NeonFit/NeonFit.xcodeproj -scheme NeonFit -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build/DD build
          find build/DD/Build/Products -maxdepth 2 -name "*.app" | sort

      - name: Empaquetar el IPA
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App encontrada: $APP"
          rm -rf Payload NEONFIT.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry NEONFIT.ipa Payload
          ls -lh NEONFIT.ipa
          unzip -l NEONFIT.ipa | head -20

      - name: Publicar el IPA como Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.1
          name: NEONFIT · IPA iPhone v1.1 (sin firmar)
          body: "NEONFIT para iPhone (IPA sin firmar, con el diseno v1.1). Para instalarlo: firmalo con tu Apple ID usando 3uTools o Sideloadly en tu PC y luego instalalo en el iPhone. La firma gratuita de Apple ID dura 7 dias y se renueva volviendo a firmar."
          files: NEONFIT.ipa

      - name: Guardar también como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NEONFIT-ipa
          path: NEONFIT.ipa
