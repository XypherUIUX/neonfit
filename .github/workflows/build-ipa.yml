name: Compilar IPA NEONFIT (iPhone)

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'appicon-ios-1024.png'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Ver la version de Xcode
        run: xcodebuild -version

      - name: Generar el proyecto iOS y meter la web
        run: |
          mkdir -p NeonFit/NeonFit/Assets.xcassets/AppIcon.appiconset NeonFit/NeonFit.xcodeproj
          cp index.html NeonFit/NeonFit/index.html
          cp appicon-ios-1024.png NeonFit/NeonFit/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          cat > NeonFit/NeonFit/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF_NEONFIT'
          {
            "images" : [
              { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF_NEONFIT
          cat > NeonFit/NeonFit/Assets.xcassets/Contents.json <<'EOF_NEONFIT'
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF_NEONFIT
          cat > NeonFit/NeonFit/AppDelegate.swift <<'EOF_NEONFIT'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = ViewController()
                  window.makeKeyAndVisible()
                  self.window = window
                  return true
              }
          }
          EOF_NEONFIT
          cat > NeonFit/NeonFit/ViewController.swift <<'EOF_NEONFIT'
          import UIKit
          import WebKit

          class ViewController: UIViewController, WKNavigationDelegate {
              var webView: WKWebView!

              override func loadView() {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = self
                  view = webView
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .white
                  webView.backgroundColor = .white
                  webView.scrollView.backgroundColor = .white
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
              }

              override var preferredStatusBarStyle: UIStatusBarStyle { .darkContent }
          }
          EOF_NEONFIT
          cat > NeonFit/NeonFit/Info.plist <<'EOF_NEONFIT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>NEONFIT</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(MARKETING_VERSION)</string>
              <key>CFBundleVersion</key>
              <string>$(CURRENT_PROJECT_VERSION)</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleDarkContent</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
          </dict>
          </plist>
          EOF_NEONFIT
          cat > NeonFit/NeonFit.xcodeproj/project.pbxproj <<'EOF_NEONFIT'
