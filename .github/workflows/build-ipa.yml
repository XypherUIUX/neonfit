                      );
                  };
          /* End PBXProject section */

          /* Begin PBXResourcesBuildPhase section */
                  AAAAAAAAAAAAAAAA00000003 /* Resources */ = {
                      isa = PBXResourcesBuildPhase;
                      buildActionMask = 2147483647;
                      files = (
                          888888888888888888888883 /* index.html in Resources */,
                          888888888888888888888884 /* Assets.xcassets in Resources */,
                      );
                      runOnlyForDeploymentPostprocessing = 0;
                  };
          /* End PBXResourcesBuildPhase section */

          /* Begin PBXSourcesBuildPhase section */
                  AAAAAAAAAAAAAAAA00000001 /* Sources */ = {
                      isa = PBXSourcesBuildPhase;
                      buildActionMask = 2147483647;
                      files = (
                          888888888888888888888881 /* AppDelegate.swift in Sources */,
                          888888888888888888888882 /* ViewController.swift in Sources */,
                      );
                      runOnlyForDeploymentPostprocessing = 0;
                  };
          /* End PBXSourcesBuildPhase section */

          /* Begin XCBuildConfiguration section */
                  DDDDDDDDDDDDDDDD00000001 /* Debug */ = {
                      isa = XCBuildConfiguration;
                      buildSettings = {
