name: Compilar APK NEONFIT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar el proyecto Android y meter la web
        run: |
          mkdir -p android/app/src/main/java/com/xypher/neonfit android/app/src/main/res/values android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable-nodpi android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/assets
          cat > android/settings.gradle <<'EOF_NEONFIT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NEONFIT"
          include ':app'
          EOF_NEONFIT
          cat > android/build.gradle <<'EOF_NEONFIT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_NEONFIT
          cat > android/app/build.gradle <<'EOF_NEONFIT'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.xypher.neonfit'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.xypher.neonfit'
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName '2.1'
              }

              signingConfigs {
                  debug {
                      storeFile file('../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_NEONFIT
          cat > android/app/src/main/AndroidManifest.xml <<'EOF_NEONFIT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.NeonFit"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_NEONFIT
          cat > android/app/src/main/java/com/xypher/neonfit/MainActivity.java <<'EOF_NEONFIT'
          package com.xypher.neonfit;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, 1001);
                  }

                  Window window = getWindow();
                  window.setStatusBarColor(Color.rgb(246, 248, 241));
                  window.setNavigationBarColor(Color.WHITE);
                  window.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.WHITE);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setGeolocationEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF_NEONFIT
          cat > android/app/src/main/res/values/strings.xml <<'EOF_NEONFIT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NEONFIT</string>
          </resources>
          EOF_NEONFIT
          cat > android/app/src/main/res/values/colors.xml <<'EOF_NEONFIT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#EDF2ED</color>
          </resources>
          EOF_NEONFIT
          cat > android/app/src/main/res/values/themes.xml <<'EOF_NEONFIT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.NeonFit" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">#F6F8F1</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF_NEONFIT
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_NEONFIT'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_art" />
          </adaptive-icon>
          EOF_NEONFIT
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF_NEONFIT'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_art" />
          </adaptive-icon>
          EOF_NEONFIT
          cp index.html android/app/src/main/assets/index.html
          cp appicon-1024.png android/app/src/main/res/drawable-nodpi/ic_launcher_art.png
          cp appicon-1024.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp appicon-1024.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          find android -type f | sort

      - name: Restaurar la firma fija
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > android/debug.keystore
          ls -l android/debug.keystore

      - name: Compilar APK (debug, instalable)
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar la APK con su nombre
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NEONFIT.apk

      - name: Publicar la APK como Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1
          name: NEONFIT · APK v2.1
          body: "NEONFIT v2.1: Descarga NEONFIT.apk e instalala en tu Android."
          files: NEONFIT.apk

      - name: Guardar también como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NEONFIT-apk
          path: NEONFIT.apk
